<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
    <title>Owner Dashboard - GoFuel Finder</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <div class="nav-brand">
          <a href="index.html">
            <img
              src="images/logomark.png"
              alt="GoFuel Logo"
              style="width: 200px; height: auto"
            />
          </a>
        </div>
        <div class="nav-links" id="navLinks">
          <a href="index.html">Home</a>
          <a href="profile.html">Profile</a>
          <a href="owner-dashboard.html">Dashboard</a>
          <a href="#" id="logoutLink">Logout</a>
        </div>
      </div>
    </nav>

    <div class="dashboard-container container">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          flex-wrap: wrap;
          gap: 15px;
        "
      >
        <h2>My Stations</h2>
        <a
          href="create-station.html"
          class="btn-primary"
          style="width: auto; text-decoration: none; display: inline-block"
          >Create New Station</a
        >
      </div>

      <div id="stationsList" class="stations-grid" style="margin-top: 20px">
        <p class="loading">Loading your stations...</p>
      </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      // ===== LOAD OWNER'S STATIONS =====
      const loadMyStations = async () => {
        const container = document.getElementById("stationsList");
        container.innerHTML = '<p class="loading">Loading your stations...</p>';

        try {
          const data = await getMyStations();

          if (data.count === 0) {
            container.innerHTML = `
                        <div class="empty-state">
                            <h3>No Stations Yet</h3>
                            <p>You haven't registered any fuel stations.</p>
                            <a href="create-station.html" class="btn-primary" style="width: auto; text-decoration: none; display: inline-block;">Create Your First Station</a>
                        </div>
                    `;
            return;
          }

          container.innerHTML = data.stations
            .map((station) => {
              const statusBadge =
                station.status === "approved"
                  ? "badge-approved"
                  : station.status === "pending"
                    ? "badge-pending"
                    : "badge-rejected";

              return `
                        <div class="station-management-card">
                            <h3>${station.name}</h3>
                            <p><strong>Address:</strong> ${station.address}, ${station.city}</p>
                            <p><strong>Petrol:</strong> ${formatPrice(station.petrol_price)}</p>
                            <p><strong>Status:</strong> <span class="${statusBadge}">${station.status.toUpperCase()}</span></p>
                            <p><strong>Open:</strong> ${station.is_open ? "Yes" : "No"}</p>
                            <div class="station-actions">
                                <a href="create-station.html?edit=${station.id}" class="btn-edit" style="text-decoration: none;">Edit</a>
                                <button class="btn-delete" onclick="handleDeleteStation('${station.id}')">Delete</button>
                            </div>
                        </div>
                    `;
            })
            .join("");
        } catch (error) {
          console.error("Load stations error:", error);
          container.innerHTML = `<p class="loading">Error: ${error.message}</p>`;
        }
      };

      // ===== HANDLE DELETE STATION =====
      const handleDeleteStation = async (id) => {
        if (!confirm("Are you sure you want to delete this station?")) return;

        try {
          await deleteStation(id); // ← Calls the API function from api.js
          alert("Station deleted successfully!");
          loadMyStations();
        } catch (error) {
          alert("Error deleting station: " + error.message);
        }
      };

      // ===== DOM CONTENT LOADED =====
      document.addEventListener("DOMContentLoaded", () => {
        updateNav();

        const user = getUser();
        if (!user) {
          window.location.href = "login.html";
          return;
        }
        if (user.role !== "station_owner" && user.role !== "admin") {
          alert("Access denied. Station owners only.");
          window.location.href = "index.html";
          return;
        }

        loadMyStations();
      });
    </script>
  </body>
</html>
